# Leveraged Credit Monitor configuration. Every threshold lives here, not in code.

fred:
  base_url: "https://api.stlouisfed.org/fred/series/observations"
  # ICE BofA option-adjusted spreads. FRED reports them in PERCENT (3.25 = 325 bp).
  series:
    IG: BAMLC0A0CM      # US Corporate (investment grade) OAS
    HY: BAMLH0A0HYM2    # US High Yield OAS (all ratings)
    BB: BAMLH0A1HYBB    # US High Yield BB OAS
    B: BAMLH0A2HYB      # US High Yield B OAS
    CCC: BAMLH0A3HYC    # US High Yield CCC & lower OAS

spreads:
  # Windows are counted in trading observations (rows), not calendar days.
  windows:
    d1: 1
    d5: 5
    m1: 21
    y1: 252
  z_threshold: 2.0            # flag when |z| exceeds this
  move_5d_threshold_bp:       # flag when |5-day change| exceeds this (bp)
    IG: 10
    HY: 25
    BB: 25
    B: 25
    CCC: 50

# SEC EDGAR: the User-Agent comes from SEC_USER_AGENT in .env, never from this file.
# Rate limit is in src/lcm/edgar.py (5 requests/s; the SEC limit is 10).

issuers:
  # fye = fiscal year end (MM-DD). Ratings: only what the filings disclose (see README).
  - ticker: TDG
    name: TransDigm Group
    cik: 1260221
    fye: "09-30"
  - ticker: FUN
    name: Six Flags Entertainment
    cik: 1999001
    fye: "12-31"
    ltm_overrides:
      gain_on_business_sale:
        value_musd: -41.027
        source: "Loss on disposal group: 41,027K for 9M 2026 and '—' for 9M 2025 (10-Q 0001999001-26-000107 p.4); no such line in FY2025 10-K (0001999001-26-000048). LTM = 0 + 41.0 - 0 = 41.0M loss. XBRL has only the 2026 YTD."
  - ticker: HGV
    name: Hilton Grand Vacations
    cik: 1674168
    fye: "12-31"
    # No operating income subtotal on HGV's income statement (10-Q p.2). "Total operating
    # expenses" (CostsAndExpenses) excludes interest, so Revenues - CostsAndExpenses = operating income.
    operating_income_fallback: revenues_minus_costs_and_expenses

  - ticker: LUMN
    name: Lumen Technologies
    cik: 18926
    fye: "12-31"
    caveats:
      - "LTM window (Oct 2025 - Sep 2026) includes the Mass Markets Fiber-to-the-Home business sold to AT&T until Feb 2, 2026; it was kept in continuing operations (10-Q p.14) and its EBITDA is not disclosed separately, so it cannot be removed. Leverage is therefore measured partly on earnings from a business Lumen no longer owns."
      - "Headline EBITDA includes the $569M net gain on the sale, booked in operating income (10-Q p.5). The supplementary column removes it."
  - ticker: BHC
    name: Bausch Health Companies
    cik: 885590
    fye: "12-31"
    ltm_overrides:
      impairments:
        value_musd: 1571
        source: "Goodwill impairments: FY2025 145 (10-K 0000885590-26-000023 p.F-6) + 9M 2026 1,426 - 9M 2025 '—' (10-Q 0000885590-26-000123 p.2). XBRL has only the 2026 YTD."
