# Leveraged Credit Monitor configuration. Every threshold lives here, not in code.

fred:
  base_url: "https://api.stlouisfed.org/fred/series/observations"
  # ICE BofA option-adjusted spreads. FRED reports them in PERCENT (3.25 = 325 bp).
  series:
    IG: BAMLC0A0CM      # US Corporate (investment grade) OAS
    HY: BAMLH0A0HYM2    # US High Yield OAS (all ratings)
    BB: BAMLH0A1HYBB    # US High Yield BB OAS
    B: BAMLH0A2HYB      # US High Yield B OAS
    CCC: BAMLH0A3HYC    # US High Yield CCC & lower OAS

spreads:
  # Windows are counted in trading observations (rows), not calendar days.
  windows:
    d1: 1
    d5: 5
    m1: 21
    y1: 252
  z_threshold: 2.0            # flag when |z| exceeds this
  move_5d_threshold_bp:       # flag when |5-day change| exceeds this (bp)
    IG: 10
    HY: 25
    BB: 25
    B: 25
    CCC: 50

# SEC EDGAR: the User-Agent comes from SEC_USER_AGENT in .env, never from this file.
# Rate limit is in src/lcm/edgar.py (5 requests/s; the SEC limit is 10).

issuers:
  # fye = fiscal year end (MM-DD). Ratings: only what the filings disclose (see README).
  - ticker: TDG
    name: TransDigm Group
    cik: 1260221
    fye: "09-30"
  - ticker: FUN
    name: Six Flags Entertainment
    cik: 1999001
    fye: "12-31"
  - ticker: HGV
    name: Hilton Grand Vacations
    cik: 1674168
    fye: "12-31"
    # No operating income subtotal on HGV's income statement (10-Q p.2). "Total operating
    # expenses" (CostsAndExpenses) excludes interest, so Revenues - CostsAndExpenses = operating income.
    operating_income_fallback: revenues_minus_costs_and_expenses
    footnotes:
      - "Operating income is DERIVED (total revenues - total operating expenses); HGV reports no operating income subtotal (10-Q p.2)."
      - "Total operating expenses include consumer financing interest on the non-recourse securitized debt and timeshare facility (FY2025: $117M, 10-K p.55; definition p.48). HGV's EBITDA is therefore struck after that interest, and its EBITDA and coverage are not comparable with the other issuers."
  - ticker: LUMN
    name: Lumen Technologies
    cik: 18926
    fye: "12-31"
    caveats:
      - "LTM window (Oct 2025 - Sep 2026) includes the Mass Markets Fiber-to-the-Home business sold to AT&T until Feb 2, 2026; it was kept in continuing operations (10-Q p.14) and its EBITDA is not disclosed, so it cannot be removed. LTM EBITDA therefore includes earnings from a business Lumen no longer owns, which likely UNDERSTATES leverage."
      - "Reported EBITDA includes the $569M net gain on the sale (inside operating income, 10-Q p.5); adjusted EBITDA removes it."
      - "Consolidated view: debt sits at Lumen (parent), Level 3 Financing and Qwest, but entity-level financials are not available (see README)."
  - ticker: BHC
    name: Bausch Health Companies
    cik: 885590
    fye: "12-31"

recovery:
  # Every assumption below is written up in the README (Milestone 3).
  multiples: [4.0, 5.5, 7.0]          # distressed EV / EBITDA scenarios
  base_case_multiple: 5.5             # used for the price comparison
  admin_pct: 0.05                     # admin & other priority claims, % of EV
  default_ebitda_haircut: 0.20        # default-scenario EBITDA = LTM adjusted EBITDA x (1 - 20%)
  bhc_bausch_lomb:
    cik: 1860742                      # Bausch + Lomb's own filings supply its EBITDA and share count
    fye: "12-31"
